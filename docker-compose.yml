services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TALENTTUNE_MODEL=${TALENTTUNE_MODEL:-claude-sonnet-4-6}
      - CORS_ORIGINS=http://localhost:8000
    volumes:
      - talenttune-data:/data
    restart: unless-stopped

volumes:
  talenttune-data:
