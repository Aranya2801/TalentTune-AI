<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentTune-AI</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #fff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
    --accent: #1f3a5f; --good: #2e7d4f; --warn: #b7791f; --bad: #b3362f;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 18px 28px; border-bottom: 1px solid var(--line); background: var(--panel);
           display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 19px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  main { max-width: 1250px; margin: 0 auto; padding: 22px 28px 60px; }
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  label { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; margin-bottom: 6px; }
  textarea { width: 100%; height: 280px; border: 1px solid var(--line); border-radius: 6px; padding: 10px;
             font: 13px/1.45 var(--mono); resize: vertical; background: #fcfcfb; }
  input[type=password], input[type=text] { border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 300px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 16px 0; }
  button { border: 1px solid var(--accent); background: var(--accent); color: #fff; padding: 8px 16px;
           border-radius: 6px; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  .small { font-size: 12px; color: var(--muted); }
  #status { font-size: 13px; color: var(--muted); }
  #status.err { color: var(--bad); }
  .results { display: none; margin-top: 8px; }
  .grid2 { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
  .big { font-size: 42px; font-weight: 700; line-height: 1; }
  .big small { font-size: 16px; color: var(--muted); font-weight: 500; }
  .comp { display: grid; grid-template-columns: 90px 1fr 40px; gap: 8px; align-items: center; font-size: 13px; margin: 5px 0; }
  .bar { height: 7px; background: #ecebe7; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .pill { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 11.5px; font-weight: 600; }
  .ok { background: #e3f1e8; color: var(--good); } .mid { background: #fbf0dc; color: var(--warn); }
  .no { background: #f8e3e1; color: var(--bad); }
  h3 { font-size: 14px; margin: 18px 0 8px; }
  ul { margin: 6px 0; padding-left: 18px; } li { margin: 3px 0; }
  .diff { font: 12.5px/1.5 var(--mono); white-space: pre-wrap; border: 1px solid var(--line); border-radius: 6px;
          padding: 10px; max-height: 560px; overflow: auto; background: #fcfcfb; }
  .diff .add { background: #e3f1e8; display: block; } .diff .del { background: #f8e3e1; text-decoration: line-through; display: block; color: #7a3a35; }
  .tabs button { background: transparent; color: var(--muted); border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 10px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  @media (max-width: 900px) { .inputs, .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>TalentTune-AI</h1>
  <span>resume / job match with explainable scores, and a rewriter that isn't allowed to make things up</span>
</header>
<main>
  <div class="inputs">
    <div class="card">
      <label>Resume <span><input type="file" id="file" accept=".pdf,.docx,.txt,.md" style="font-size:12px"></span></label>
      <textarea id="resume" placeholder="Paste your resume as plain text, or upload a PDF / DOCX"></textarea>
    </div>
    <div class="card">
      <label>Job description <a href="#" id="example" class="small">load example</a></label>
      <textarea id="jd" placeholder="Paste the full job post"></textarea>
    </div>
  </div>

  <div class="row">
    <button id="btnScore">Score</button>
    <button id="btnTailor" class="ghost">Tailor resume</button>
    <input type="password" id="key" placeholder="Anthropic key (optional, kept in this tab only)">
    <span id="status"></span>
  </div>

  <section class="results" id="results">
    <div class="grid2">
      <div class="card">
        <div class="big" id="scoreBig">–</div>
        <div class="small" id="scoreSub"></div>
        <div id="comps" style="margin-top:14px"></div>
        <div id="notes"></div>
      </div>
      <div class="card">
        <div class="tabs" id="tabs">
          <button data-t="req" class="on">Requirements</button>
          <button data-t="rew">Rewrite</button>
          <button data-t="fix">To fix</button>
        </div>
        <div id="tab-req"></div>
        <div id="tab-rew" style="display:none"></div>
        <div id="tab-fix" style="display:none"></div>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lastTailored = null;

try { $("key").value = sessionStorage.getItem("tt_key") || ""; } catch (e) {}
$("key").addEventListener("change", () => { try { sessionStorage.setItem("tt_key", $("key").value); } catch (e) {} });

function status(msg, err = false) { $("status").textContent = msg; $("status").className = err ? "err" : ""; }

async function api(path, body, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if ($("key").value.trim()) headers["X-Anthropic-Key"] = $("key").value.trim();
  const r = await fetch(path, { method: "POST", headers, body: JSON.stringify(body), ...opts });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    const d = Array.isArray(e.detail) ? e.detail.map(x => x.msg).join("; ") : e.detail;
    throw new Error(d || `HTTP ${r.status}`);
  }
  return r;
}

function inputs() {
  const resume_text = $("resume").value.trim(), job_description = $("jd").value.trim();
  if (resume_text.length < 50 || job_description.length < 50) throw new Error("paste a resume and a job description first");
  return { resume_text, job_description };
}

function pill(ev) {
  if (ev >= 0.8) return `<span class="pill ok">${ev.toFixed(2)}</span>`;
  if (ev > 0) return `<span class="pill mid">${ev.toFixed(2)}</span>`;
  return `<span class="pill no">none</span>`;
}

function renderReport(rep, before = null) {
  $("results").style.display = "block";
  $("scoreBig").innerHTML = before !== null
    ? `${before.score} → ${rep.score} <small>/ 100</small>` : `${rep.score} <small>/ 100</small>`;
  $("scoreSub").textContent = rep.years_required
    ? `~${rep.years_experience} yrs from your dates, JD asks ${rep.years_required}+` : `~${rep.years_experience} yrs of dated experience`;
  $("comps").innerHTML = Object.entries(rep.components).map(([k, v]) =>
    `<div class="comp"><span>${k}</span><div class="bar"><i style="width:${v * 100}%"></i></div><span>${v.toFixed(2)}</span></div>`).join("");
  $("notes").innerHTML = rep.notes.length ? `<h3>Notes</h3><ul>${rep.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : "";
  $("tab-req").innerHTML = `<table><tr><th>JD asks for</th><th>weight</th><th>evidence</th><th>where</th></tr>` +
    rep.requirements.map(m => `<tr><td>${esc(m.requirement)}</td><td>${m.importance}</td><td>${pill(m.evidence)}</td>
      <td class="small">${esc(m.where || "")}${m.line ? `<br>“${esc(m.line.slice(0, 90))}”` : ""}</td></tr>`).join("") + `</table>`;
}

// line diff (LCS), good enough for resumes
function diffLines(a, b) {
  const A = a.split("\n"), B = b.split("\n"), n = A.length, m = B.length;
  const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = A[i].trim() === B[j].trim() ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0, out = [];
  while (i < n && j < m) {
    if (A[i].trim() === B[j].trim()) { out.push(esc(B[j]) + "\n"); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push(`<span class="del">${esc(A[i])}</span>`); i++; }
    else { out.push(`<span class="add">${esc(B[j])}</span>`); j++; }
  }
  while (i < n) out.push(`<span class="del">${esc(A[i++])}</span>`);
  while (j < m) out.push(`<span class="add">${esc(B[j++])}</span>`);
  return out.join("");
}

function renderTailor(res, original) {
  renderReport(res.after, res.before);
  const g = res.grounding;
  const first = res.first_draft_grounding;
  $("tab-rew").innerHTML = `
    <p class="small">mode: <b>${esc(res.mode)}</b> · faithfulness ${g.faithfulness.toFixed(0)}/100
      ${first && !first.ok ? ` · first draft had ${first.issues.length} unsupported claim(s), ${res.repair_rounds} repair round(s)` : ""}</p>
    <div class="row" style="margin:8px 0">
      <button class="ghost" data-fmt="pdf">PDF</button><button class="ghost" data-fmt="docx">DOCX</button>
      <button class="ghost" data-fmt="md">Markdown</button><button class="ghost" id="copy">Copy text</button>
    </div>
    <div class="diff">${diffLines(original, res.resume)}</div>
    ${g.issues.length ? `<h3>Fact-check</h3><ul>${g.issues.map(i => `<li><b>${esc(i.kind)}</b> ${esc(i.detail)}</li>`).join("")}</ul>` : ""}
    ${res.changes.length ? `<h3>Changes</h3><ul>${res.changes.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}`;
  $("tab-fix").innerHTML = res.suggestions.length
    ? `<p class="small">These need facts only you have, so the tool doesn't guess them.</p><ul>${res.suggestions.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`
    : `<p class="small">Nothing obvious.</p>`;
  $("tab-rew").querySelectorAll("[data-fmt]").forEach(b => b.onclick = () => exportAs(b.dataset.fmt));
  $("copy").onclick = () => navigator.clipboard.writeText(res.resume).then(() => status("copied"));
  showTab("rew");
}

async function exportAs(fmt) {
  try {
    const r = await api(`/api/v1/export/${fmt}`, { resume_text: lastTailored.resume });
    const blob = await r.blob();
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `resume.${fmt}` });
    a.click(); URL.revokeObjectURL(a.href);
  } catch (e) { status(e.message, true); }
}

function showTab(t) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  ["req", "rew", "fix"].forEach(x => $("tab-" + x).style.display = x === t ? "block" : "none");
}
$("tabs").onclick = (e) => { if (e.target.dataset.t) showTab(e.target.dataset.t); };

async function run(kind) {
  const btns = [$("btnScore"), $("btnTailor")];
  try {
    const body = inputs();
    btns.forEach(b => b.disabled = true);
    status(kind === "score" ? "scoring…" : "tailoring… (with an LLM this takes ~20-40s)");
    if (kind === "score") {
      renderReport(await (await api("/api/v1/score", body)).json());
      showTab("req");
    } else {
      lastTailored = await (await api("/api/v1/tailor", { ...body, use_llm: true })).json();
      renderTailor(lastTailored, body.resume_text);
    }
    status("");
  } catch (e) { status(e.message, true); }
  finally { btns.forEach(b => b.disabled = false); }
}
$("btnScore").onclick = () => run("score");
$("btnTailor").onclick = () => run("tailor");

$("file").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  status("reading file…");
  try {
    const r = await fetch("/api/v1/parse", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "upload failed");
    $("resume").value = d.text; status(`read ${d.chars} characters from ${f.name}`);
  } catch (err) { status(err.message, true); }
};

$("example").onclick = async (e) => {
  e.preventDefault();
  const [r, j] = await Promise.all([fetch("/examples/resume.txt"), fetch("/examples/job_description.txt")]);
  if (r.ok) $("resume").value = await r.text();
  if (j.ok) $("jd").value = await j.text();
};
</script>
</body>
</html>
