[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talenttune"
version = "0.3.0"
description = "Explainable resume/JD matching and a fact-checked resume rewriter"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aranya Ghosh" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
talenttune = "talenttune.cli:main"

[tool.setuptools.packages.find]
include = ["talenttune*"]

[tool.setuptools.package-data]
talenttune = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B905"]  # FastAPI File(...) defaults; zip(strict=) is noise here
